<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shopee Re-Auth</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #253347;
      --bg-input: #0f172a;
      --accent: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.25);
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.12);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.12);
      --skip: #eab308;
      --skip-bg: rgba(234, 179, 8, 0.12);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #334155;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* --- Top ambient glow --- */
    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 260px;
      background: radial-gradient(ellipse, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* --- Header --- */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 20px 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #f97316, #fb923c);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo-text span {
      color: var(--accent);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* --- Tabs --- */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-input);
      border-radius: var(--radius-sm);
      padding: 3px;
    }

    .tab {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s;
    }

    .tab.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* --- Content --- */
    .content {
      position: relative;
      z-index: 1;
      padding: 20px;
      padding-bottom: 40px;
    }

    .page { display: none; }
    .page.active { display: block; animation: fadeUp 0.3s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Re-Auth Page --- */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .shop-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .shop-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s;
    }

    .shop-card:active {
      transform: scale(0.98);
      background: var(--bg-card-hover);
    }

    .shop-card.selected {
      border-color: var(--accent);
      background: rgba(249, 115, 22, 0.06);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .shop-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .shop-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #334155, #475569);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .shop-card.selected .shop-avatar {
      background: linear-gradient(135deg, #f97316, #fb923c);
      color: white;
    }

    .shop-name {
      font-size: 14px;
      font-weight: 600;
    }

    .shop-id {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 2px;
    }

    .radio-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .shop-card.selected .radio-circle {
      border-color: var(--accent);
      background: var(--accent);
    }

    .radio-circle::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .shop-card.selected .radio-circle::after {
      opacity: 1;
    }

    /* --- Button --- */
    .btn-reauth {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px var(--accent-glow);
      position: relative;
      overflow: hidden;
    }

    .btn-reauth:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-reauth:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-reauth .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* --- Toast --- */
    .toast {
      position: fixed;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 20px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      z-index: 999;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: calc(100vw - 40px);
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .toast.show { top: 20px; }

    .toast.success {
      background: rgba(34, 197, 94, 0.9);
      color: white;
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.3);
    }

    .toast.error {
      background: rgba(239, 68, 68, 0.9);
      color: white;
      box-shadow: 0 8px 30px rgba(239, 68, 68, 0.3);
    }

    /* --- Log Page --- */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .btn-refresh {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      padding: 8px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-refresh:active { transform: scale(0.96); }

    .btn-refresh svg {
      width: 14px;
      height: 14px;
      transition: transform 0.4s;
    }

    .btn-refresh.spinning svg {
      animation: spin 0.6s linear infinite;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      border-left: 3px solid var(--text-muted);
      animation: fadeUp 0.3s ease both;
    }

    .log-item.SUCCESS { border-left-color: var(--success); }
    .log-item.ERROR { border-left-color: var(--error); }
    .log-item.SKIPPED { border-left-color: var(--skip); }

    .log-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .log-account {
      font-size: 14px;
      font-weight: 600;
    }

    .log-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .log-badge.SUCCESS { background: var(--success-bg); color: var(--success); }
    .log-badge.ERROR { background: var(--error-bg); color: var(--error); }
    .log-badge.SKIPPED { background: var(--skip-bg); color: var(--skip); }

    .log-message {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .log-time {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* --- Empty state --- */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* --- Loading skeleton --- */
    .skeleton {
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      height: 68px;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
    }

    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Filter chips */
    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }

    .chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
  </style>
</head>
<body>

  <div class="toast" id="toast"></div>

  <div class="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">🔄</div>
        <div class="logo-text"><span>Shopee</span> Re-Auth</div>
      </div>
      <div class="status-dot" id="statusDot"></div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('reauth')">Re-Auth</button>
      <button class="tab" onclick="switchTab('logs')">Log Proses</button>
    </div>
  </div>

  <div class="content">
    <!-- RE-AUTH PAGE -->
    <div class="page active" id="page-reauth">
      <div class="section-label">Pilih Toko</div>
      <div class="shop-list" id="shopList">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
      <button class="btn-reauth" id="btnReauth" disabled onclick="doReauth()">
        Pilih toko terlebih dahulu
      </button>
    </div>

    <!-- LOG PAGE -->
    <div class="page" id="page-logs">
      <div class="log-header">
        <div class="section-label" style="margin:0">Riwayat Proses</div>
        <button class="btn-refresh" id="btnRefresh" onclick="loadLogs()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Refresh
        </button>
      </div>
      <div class="filter-row">
        <button class="chip active" onclick="filterLogs('ALL')">Semua</button>
        <button class="chip" onclick="filterLogs('SUCCESS')">Sukses</button>
        <button class="chip" onclick="filterLogs('ERROR')">Error</button>
        <button class="chip" onclick="filterLogs('SKIPPED')">Skipped</button>
      </div>
      <div class="log-list" id="logList">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </div>
  </div>

  <script>
    // const API_URL = 'https://script.google.com/macros/s/AKfycbyVrF0k-5FjEgFSkLXdL6yHLucK9hc8hMBDFgY6M1UxXE0trV5h6wZMJjUASO8fvRy-/exec';
    const API_URL = 'https://script.google.com/macros/s/AKfycbw_7raX7l60VofYt_Za5Scr7a0DXKBJnh51KGZH_Vk0DemTiL1HYALA35Cax38RtemQ2A/exec';

    let selectedShop = null;
    let allLogs = [];
    let currentFilter = 'ALL';

    // --- TABS ---
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'reauth' && i === 0) || (tab === 'logs' && i === 1));
      });
      document.getElementById('page-reauth').classList.toggle('active', tab === 'reauth');
      document.getElementById('page-logs').classList.toggle('active', tab === 'logs');

      if (tab === 'logs') loadLogs();
    }

    // --- LOAD SHOPS ---
    async function loadShops() {
      try {
        const res = await fetch(API_URL + '?action=getShops');
        const data = await res.json();
        if (!data.success || !data.shops.length) {
          document.getElementById('shopList').innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Tidak ada toko ditemukan</p></div>';
          return;
        }
        renderShops(data.shops);
      } catch (e) {
        document.getElementById('shopList').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Gagal memuat data toko</p></div>';
      }
    }

    function renderShops(shops) {
      const html = shops.map(shop => `
        <div class="shop-card" data-id="${shop.id}" data-name="${shop.name}" onclick="selectShop(this)">
          <div class="shop-info">
            <div class="shop-avatar">${shop.name.substring(0, 2).toUpperCase()}</div>
            <div>
              <div class="shop-name">${shop.name}</div>
              <div class="shop-id">ID: ${shop.id}</div>
            </div>
          </div>
          <div class="radio-circle"></div>
        </div>
      `).join('');
      document.getElementById('shopList').innerHTML = html;
    }

    function selectShop(el) {
      document.querySelectorAll('.shop-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedShop = { id: el.dataset.id, name: el.dataset.name };

      const btn = document.getElementById('btnReauth');
      btn.disabled = false;
      btn.textContent = 'Re-Auth ' + selectedShop.name;
    }

    // --- RE-AUTH ---
    async function doReauth() {
      if (!selectedShop) return;

      const btn = document.getElementById('btnReauth');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Processing...';

      try {
        const url = `${API_URL}?action=reauth&id=${encodeURIComponent(selectedShop.id)}&name=${encodeURIComponent(selectedShop.name)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.success) {
          showToast(data.message, 'success');
        } else {
          showToast(data.message || 'Gagal Re-Auth', 'error');
        }
      } catch (e) {
        showToast('Network error: ' + e.message, 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Re-Auth ' + selectedShop.name;
    }

    // --- LOGS ---
    async function loadLogs() {
      const btn = document.getElementById('btnRefresh');
      btn.classList.add('spinning');

      try {
        const res = await fetch(API_URL + '?action=getLogs');
        const data = await res.json();
        allLogs = data.success ? data.logs : [];
        renderLogs();
      } catch (e) {
        document.getElementById('logList').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Gagal memuat log</p></div>';
      }

      btn.classList.remove('spinning');
    }

    function filterLogs(status) {
      currentFilter = status;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      renderLogs();
    }

    function renderLogs() {
      const filtered = currentFilter === 'ALL' ? allLogs : allLogs.filter(l => l.status === currentFilter);

      if (!filtered.length) {
        document.getElementById('logList').innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>Belum ada log' + (currentFilter !== 'ALL' ? ' ' + currentFilter.toLowerCase() : '') + '</p></div>';
        return;
      }

      const html = filtered.map((log, i) => `
        <div class="log-item ${log.status}" style="animation-delay:${i * 0.05}s">
          <div class="log-top">
            <div class="log-account">${log.account}</div>
            <span class="log-badge ${log.status}">${log.status}</span>
          </div>
          <div class="log-message">${log.message}</div>
          <div class="log-time">${log.timestamp}</div>
        </div>
      `).join('');

      document.getElementById('logList').innerHTML = html;
    }

    // --- TOAST ---
    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast ' + type + ' show';
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // --- INIT ---
    loadShops();

    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
